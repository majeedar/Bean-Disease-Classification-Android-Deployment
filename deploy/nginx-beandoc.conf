# BeanDoc download site: static files behind the host's nginx (works on a VM shared with other sites).
# Uploaded by deploy/deploy.sh. certbot adds the 443 block and the HTTP -> HTTPS redirect.
# Install (as root; on a shared server never reload nginx when `nginx -t` fails):
#   sed 's/beandoc.example.com/<your-host>/' nginx-beandoc.conf > /etc/nginx/sites-available/beandoc
#   ln -s /etc/nginx/sites-available/beandoc /etc/nginx/sites-enabled/beandoc
#   nginx -t && systemctl reload nginx && certbot --nginx -d <your-host> --redirect

server {
    listen 80;
    server_name beandoc.example.com;

    root /home/app/beandoc/site;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # NOTE: no add_header inside the locations below; nginx would then drop all the headers above for that location.

    # Android needs this type to offer "Install" after the download.
    # beandoc.apk is the stable link (changes each release); versioned files never change.
    location = /beandoc.apk {
        types { application/vnd.android.package-archive apk; }
        expires -1;
        try_files $uri =404;
    }
    location ~ ^/beandoc-[0-9][^/]*\.apk$ {
        types { application/vnd.android.package-archive apk; }
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
